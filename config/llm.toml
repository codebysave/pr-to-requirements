# Configurazione LLM di PR4Requirements (Decisione 3.2).
#
# Un blocco per agente: il modello è selezionabile separatamente per il
# Generation Agent e per l'Assessment Agent. Questo file è versionato e
# documenta la configurazione usata in ogni esecuzione; le credenziali NON
# vanno mai qui (la chiave API vive solo in .env / variabili d'ambiente).
#
# In fase di sviluppo entrambi gli agenti usano il modello economico della
# famiglia Claude (fascia Haiku). I parametri per gli esperimenti finali
# verranno calibrati nella fase sperimentale (Decisione 3.7).
#
# Nota sui parametri di campionamento: `temperature`, `top_p` e `top_k` non
# esistono più nell'API dei modelli attuali (rimossi dal fornitore). Alcuni
# modelli accettano al loro posto `effort` (low | medium | high | xhigh |
# max), che regola profondità del ragionamento e spesa di token. La fascia
# Haiku non lo supporta, quindi qui non viene impostato.

[generation]
model = "claude-haiku-4-5"
max_tokens = 1024

[assessment]
model = "claude-haiku-4-5"
# 4096 e non 2048: nell'esecuzione del 2026-08-27 con Sonnet valutatore la
# risposta è stata troncata a metà JSON e la Pull Request è finita in ERROR.
# Il valutatore, quando ha correzioni da motivare, scrive molto più del
# generatore: il suo limite va tenuto largo.
max_tokens = 4096
