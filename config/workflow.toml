# Configurazione del workflow di PR-to-Requirements (Decisione 3.5, §20).
#
# Questi parametri permettono di eseguire il workflow in configurazioni
# diverse senza modificare il codice: sviluppo incrementale, prove
# progressive (Decisione 3.7, §2) e debug di un singolo componente. La
# configurazione di riferimento per la valutazione finale è il workflow
# completo.
#
# `max_generation_attempts = 3` consente una generazione iniziale e fino a
# due revisioni; il valore verrà verificato empiricamente.
#
# `memory_enabled` governa soltanto il **recupero** dei requisiti storici, cioè
# l'unica cosa che cambia l'input del valutatore. L'archiviazione avviene
# comunque: sono due funzioni distinte con due interruttori distinti. Con il
# recupero attivo il sistema diventa dipendente dall'ordine di elaborazione,
# quindi acceso e spento sono due condizioni sperimentali diverse da riportare
# nei risultati (Decisione 3.7).

[workflow]
assessment_enabled = true
memory_enabled = true
max_generation_attempts = 3

# Lunghezza minima complessiva di titolo e corpo perché una Pull Request
# venga sottoposta agli agenti. È un criterio di comodo, non una soglia
# fondata: va calibrato sul gold standard (punto aperto sulle Pull Request
# con corpo assente o scarsamente informativo). Con 0 il controllo si limita
# a scartare i corpi vuoti.
min_evidence_characters = 50

# Numero massimo di requisiti storici mostrati al valutatore. Non è un `top_k`:
# il recupero è esaustivo entro i filtri di progetto e di data, e questo valore
# serve solo a impedire che un archivio cresciuto oltre le previsioni gonfi il
# messaggio senza che nessuno se ne accorga. Se scatta, vengono tenuti i più
# recenti e il log lo segnala.
max_memory_requirements = 50
