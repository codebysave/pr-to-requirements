[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-to-requirements"
version = "0.1.0"
description = "Automatic Requirement Extraction from PRs using LLM-based Agents"
requires-python = ">=3.11"
authors = [
    { name = "Andrea Saverino" },
    { name = "Marco Saverino Salvatore" },
]
dependencies = [
    "anthropic>=1.0.0",
    "langgraph>=1.2.11",
    "mcp>=2.1.1",
    "python-dotenv>=1.2.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0.0",
    "mypy>=1.10.0",
]
